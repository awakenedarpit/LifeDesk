name: Patch Hackathon Milestones

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-hackathon-milestones.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch milestone creation flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/views/HackathonsView.tsx')
          text = path.read_text()

          old = """const DEFAULT_STAGES: MilestoneStage[] = [\n  'Registration',\n  'Idea Submission',\n  'PPT Submission',\n  'Screening Quiz',\n  'Prototype',\n  'Final Submission',\n  'Final Pitch',\n];\n\n"""
          text = text.replace(old, '')

          old = """  const [problemStatementStatus, setProblemStatementStatus] = useState<ProblemStatementStatus>('Not Announced');\n  const [problemStatement, setProblemStatement] = useState('');\n  const [eventDate, setEventDate] = useState(today());\n"""
          new = """  const [problemStatementStatus, setProblemStatementStatus] = useState<ProblemStatementStatus>('Not Announced');\n  const [problemStatement, setProblemStatement] = useState('');\n  const [eventDate, setEventDate] = useState(today());\n  const [selectedMilestoneStages, setSelectedMilestoneStages] = useState<MilestoneStage[]>([]);\n  const [milestoneDates, setMilestoneDates] = useState<Record<string, string>>({});\n\n  const milestoneOptions: MilestoneStage[] = [\n    'Registration',\n    'Idea Submission',\n    'PPT Submission',\n    'Screening Quiz',\n    'Prototype',\n    'Final Submission',\n    'Final Pitch',\n  ];\n\n  const toggleMilestoneSelection = (stage: MilestoneStage) => {\n    setSelectedMilestoneStages((current) => {\n      if (current.includes(stage)) {\n        setMilestoneDates((dates) => {\n          const next = { ...dates };\n          delete next[stage];\n          return next;\n        });\n        return current.filter((item) => item !== stage);\n      }\n\n      setMilestoneDates((dates) => ({ ...dates, [stage]: dates[stage] || eventDate }));\n      return [...current, stage];\n    });\n  };\n"""
          if old not in text:
              raise SystemExit('state anchor not found')
          text = text.replace(old, new)

          old = """    setProblemStatementStatus('Not Announced');\n    setProblemStatement('');\n    setEventDate(today());\n    setBannerImage('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=800&auto=format&fit=crop&q=80');\n"""
          new = """    setProblemStatementStatus('Not Announced');\n    setProblemStatement('');\n    setEventDate(today());\n    setSelectedMilestoneStages([]);\n    setMilestoneDates({});\n    setBannerImage('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=800&auto=format&fit=crop&q=80');\n"""
          if old not in text:
              raise SystemExit('reset anchor not found')
          text = text.replace(old, new)

          old = """    const hackId = `hack-${Date.now()}`;\n    const metadata = writeMeta({\n"""
          new = """    const hackId = `hack-${Date.now()}`;\n    const metadata = writeMeta({\n"""
          if old not in text:
              raise SystemExit('create anchor not found')

          old = """      eventDate,\n      milestones: DEFAULT_STAGES.map((stage, idx) => ({\n        id: `ms-${Date.now()}-${idx}`,\n        hackathonId: hackId,\n        stage,\n        title: stage,\n        date: eventDate,\n        status: idx === 0 ? 'Completed' : idx === 1 ? 'Current' : 'Pending',\n      })),\n"""
          new = """      eventDate,\n      milestones: selectedMilestoneStages.map((stage, idx) => ({\n        id: `ms-${Date.now()}-${idx}`,\n        hackathonId: hackId,\n        stage,\n        title: stage,\n        date: milestoneDates[stage] || eventDate,\n        status: 'Pending',\n      })),\n"""
          if old not in text:
              raise SystemExit('milestone creation block not found')
          text = text.replace(old, new)

          old = """              <div><label className=\"font-label-xs text-xs text-on-surface-variant uppercase font-bold block mb-1\">Hackathon / Event Date *</label><input required type=\"date\" value={eventDate} onChange={(e) => setEventDate(e.target.value)} className=\"w-full h-10 px-3 bg-surface-container-low rounded-xl text-on-surface text-sm outline-none\" /><p className=\"text-[10px] text-on-surface-variant mt-1\">All default milestones will start on this same date. You can edit individual dates later.</p></div>\n"""
          new = """              <div><label className=\"font-label-xs text-xs text-on-surface-variant uppercase font-bold block mb-1\">Hackathon / Event Date *</label><input required type=\"date\" value={eventDate} onChange={(e) => setEventDate(e.target.value)} className=\"w-full h-10 px-3 bg-surface-container-low rounded-xl text-on-surface text-sm outline-none\" /><p className=\"text-[10px] text-on-surface-variant mt-1\">This is the default date used when you select a timeline.</p></div>\n\n              <div className=\"p-3 rounded-xl bg-surface-container-low border border-surface-container flex flex-col gap-2.5\">\n                <div>\n                  <label className=\"font-label-xs text-xs text-on-surface-variant uppercase font-bold block\">Milestone Timelines</label>\n                  <p className=\"text-[10px] text-on-surface-variant mt-1\">Select only the timelines you want. Nothing is created automatically.</p>\n                </div>\n                <div className=\"grid grid-cols-1 gap-1.5\">\n                  {milestoneOptions.map((stage) => {\n                    const selected = selectedMilestoneStages.includes(stage);\n                    return (\n                      <div key={stage} className=\"flex items-center gap-2\">\n                        <button type=\"button\" onClick={() => toggleMilestoneSelection(stage)} className={`flex-1 h-9 px-3 rounded-lg border text-left text-xs font-semibold transition-all ${selected ? 'border-primary bg-primary/10 text-primary' : 'border-surface-container bg-surface-container-lowest text-on-surface-variant hover:border-primary/40'}`}>\n                          <span className=\"material-symbols-outlined align-middle text-[15px] mr-1\">{selected ? 'check_box' : 'check_box_outline_blank'}</span>{stage}\n                        </button>\n                        {selected && <input aria-label={`${stage} date`} required type=\"date\" value={milestoneDates[stage] || eventDate} onChange={(e) => setMilestoneDates((dates) => ({ ...dates, [stage]: e.target.value }))} className=\"h-9 w-[132px] px-2 bg-surface-container-lowest border border-surface-container rounded-lg text-on-surface text-[11px] outline-none\" />}\n                      </div>\n                    );\n                  })}\n                </div>\n                <span className=\"text-[10px] text-on-surface-variant\">{selectedMilestoneStages.length} timeline{selectedMilestoneStages.length === 1 ? '' : 's'} selected</span>\n              </div>\n"""
          if old not in text:
              raise SystemExit('create modal date block not found')
          text = text.replace(old, new)

          marker = "const DEFAULT_STAGES"
          if marker in text:
              raise SystemExit('old default stages still present')
          if 'milestones: DEFAULT_STAGES.map' in text:
              raise SystemExit('old automatic milestone creation still present')

          path.write_text(text)
          PY

      - name: Commit patched file
        run: |
          if git diff --quiet -- src/views/HackathonsView.tsx; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/views/HackathonsView.tsx
          git commit -m 'feat: make hackathon milestones optional and selectable'
          git push
