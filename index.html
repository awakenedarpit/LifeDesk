    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LifeDesk - Student Command Center",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "All",
        "description": "Your Life, Organized. Premium personal student command-center for tasks, deadlines, calendar, hackathons, and multi-source finances.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LifeDesk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lifedesk_theme') || 'light';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', isDark ? '#101B19' : '#F4FAF6');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
        src: url('/fonts/material-symbols-outlined.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Plus Jakarta Sans Fallback';
        src: local('Arial'), local('Helvetica Neue'), local('DejaVu Sans');
        size-adjust: 101%;
        ascent-override: 97%;
        descent-override: 25%;
        line-gap-override: 0%;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #F4FAF6;
        color: #173C30;
        font-family: 'Plus Jakarta Sans', 'Plus Jakarta Sans Fallback', system-ui, -apple-system, sans-serif;
      }
      html.dark, html.dark body {
        background-color: #101B19;
        color: #E5F7EF;
      }
    </style>
  </head>
  <body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-fixed selection:text-on-primary-fixed">
